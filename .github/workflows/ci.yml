name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  webui:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/webui/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/webui/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # The binary embeds internal/webui/web, and go install must work without
      # Node, so the build output is committed. It must match the sources.
      - name: Check the committed build is current
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- internal/webui/web)" ]; then
            echo "internal/webui/web is stale: run npm run build in internal/webui/frontend and commit the result."
            git status --short -- internal/webui/web
            exit 1
          fi

  portable:
    name: Core contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test portable filesystem, protocol and provider contracts
        run: go test -race ./internal/fsutil ./internal/provider ./internal/protocol ./internal/modelrouting ./internal/slotrec ./internal/modelsdev ./internal/proxymanager ./internal/acp ./internal/claudeaccount
      - name: Build native CLI
        run: go build -o ccl-verify${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Test standalone proxy process lifecycle
        env:
          CCL_TEST_BINARY: ${{ github.workspace }}/ccl-verify${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test -race -v ./integration/proxy
      - name: Test Windows configuration UI and command routing
        if: runner.os == 'Windows'
        run: go test -race ./cmd -run 'Test(ConfigAllRows|PickersFollow|CJKCancel|ProviderSelectionFits|OAuthAndMapping|TooSmallTerminal|Proxy)'
      - name: Test Claude model picker labels and process launch
        run: go test -race -v ./internal/claude -run 'Test(Agent|ModelPicker|ProviderModelPicker|BuildEnvUsesProviderCatalogDisplayNames|CatalogModelOverrides|ModelDisplayName|SettingsRespectTheUsersOwnPreferences|ProcessEnv)'
      - name: Test Claude accounts and one-shot provider selection
        run: go test -race -v ./cmd -run 'Test(LeadingLaunchOptions|ClaudeAccountLogin|FailedClaudeAccount|UnnamedClaudeLogin)'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test npm packaging and ACP configuration decorators
        run: node --test scripts/npm-packages.test.js scripts/acp-adapter.test.mjs
      - name: Install pinned upstream ACP adapter
        run: npm install --prefix "${{ runner.temp }}/ccl-acp-adapter" --ignore-scripts --no-audit --no-fund @agentclientprotocol/claude-agent-acp@0.90.0
      - name: Test real ACP adapter and SDK with local providers
        env:
          CCL_TEST_BINARY: ${{ github.workspace }}/ccl-verify${{ runner.os == 'Windows' && '.exe' || '' }}
          CCL_TEST_AGENT_ACP: ${{ runner.temp }}/ccl-acp-adapter/node_modules/.bin/claude-agent-acp${{ runner.os == 'Windows' && '.cmd' || '' }}
        run: go test -race -v ./integration/acp
      - name: Install pinned Claude Code for account isolation check
        run: npm install --prefix "${{ runner.temp }}/ccl-claude-account" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.312
      - name: Test real Claude Code account isolation
        env:
          CCL_TEST_BINARY: ${{ github.workspace }}/ccl-verify${{ runner.os == 'Windows' && '.exe' || '' }}
          CCL_TEST_CLAUDE: ${{ runner.temp }}/ccl-claude-account/node_modules/@anthropic-ai/claude-code-${{ runner.os == 'Windows' && 'win32' || runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}/claude${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test -race -v ./integration/claudeaccount
