name: Release and Publish

on:
  push:
    tags:
      - 'v*'
    # Tag-scoped caches are unavailable to later tags. Warm reusable target
    # caches on main when dependencies/build settings change.
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - scripts/build-release.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
            echo 'version=dev' >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Release tags must use vMAJOR.MINOR.PATCH (or legacy vMAJOR.MINOR.PATCH.BUILD): $TAG_NAME"
            exit 1
          fi

  verify:
    name: Verify release
    if: github.ref_type == 'tag'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset: ccl-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: ccl-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: ccl-linux-amd64
          - goos: linux
            goarch: arm64
            asset: ccl-linux-arm64
          - goos: windows
            goarch: amd64
            asset: ccl-win32-x64.exe
          - goos: windows
            goarch: arm64
            asset: ccl-win32-arm64.exe
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache target dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ccl-release-v2-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/build-release.sh') }}
          restore-keys: |
            ccl-release-v2-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ steps.go.outputs.go-version }}-
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OUTPUT: dist/${{ matrix.asset }}
          # Public Desktop OAuth client for Google Drive cloud sync; release
          # binaries carry no built-in client, so both are required.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [[ -z "$GOOGLE_OAUTH_CLIENT_ID" || -z "$GOOGLE_OAUTH_CLIENT_SECRET" ]]; then
            echo "GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET secrets are required" >&2
            exit 1
          fi
          bash scripts/build-release.sh
      # GitHub releases ship each binary gzip-compressed (~28 MB -> ~10 MB);
      # `ccl update` downloads <asset>.gz. -n drops the name and timestamp so
      # the archive depends only on the binary.
      - name: Compress binary
        if: github.ref_type == 'tag'
        run: gzip -9 -n "dist/${{ matrix.asset }}"
      - name: Upload binary
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [prepare, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ccl-*
          path: dist
          merge-multiple: true
      - name: Verify asset set and create checksums
        run: |
          for asset in ccl-darwin-amd64 ccl-darwin-arm64 ccl-linux-amd64 ccl-linux-arm64 ccl-win32-x64.exe ccl-win32-arm64.exe; do
            gzip -t "dist/$asset.gz"
          done
          (cd dist && sha256sum ccl-*.gz > SHA256SUMS)
          ls -lh dist
      # gh uploads the assets concurrently (softprops uploaded them one at a
      # time). With assets it creates a draft, uploads, then publishes, so a
      # failed upload never leaves a half-populated release.
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          assets=(dist/* THIRD_PARTY_NOTICES.md)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # A re-run: refresh the assets of the existing release.
            gh release upload "$VERSION" "${assets[@]}" --clobber
            exit 0
          fi
          notes=()
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            # Prepended to the generated notes, as softprops body_path did.
            notes=(--notes-file "docs/releases/$VERSION.md")
          fi
          gh release create "$VERSION" "${assets[@]}" --verify-tag --generate-notes "${notes[@]}"

  # Each platform package ships one native binary; npm installs only the
  # matching optional dependency. Publish the launcher after all six versions.
  npm:
    name: Publish npm
    if: github.ref_type == 'tag'
    needs: [prepare, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ccl-*
          path: dist
          merge-multiple: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Prepare platform-specific npm packages
        env:
          TAG_NAME: ${{ needs.prepare.outputs.version }}
        run: node scripts/build-npm-packages.js "$TAG_NAME"
      - name: Verify npm packaging
        run: node --test scripts/npm-packages.test.js
      - name: Publish platform packages and launcher with Trusted Publishing
        run: node scripts/publish-npm-packages.js dist/npm
