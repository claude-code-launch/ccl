name: Release and Publish

on:
  push:
    tags:
      - 'v*'
    # Tag-scoped caches are unavailable to later tags. Warm reusable target
    # caches on main when dependencies/build settings change.
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - scripts/build-release.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
            echo 'version=dev' >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Release tags must use vMAJOR.MINOR.PATCH (or legacy vMAJOR.MINOR.PATCH.BUILD): $TAG_NAME"
            exit 1
          fi

  verify:
    name: Verify release
    if: github.ref_type == 'tag'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset: ccl-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: ccl-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: ccl-linux-amd64
          - goos: linux
            goarch: arm64
            asset: ccl-linux-arm64
          - goos: windows
            goarch: amd64
            asset: ccl-win32-x64.exe
          - goos: windows
            goarch: arm64
            asset: ccl-win32-arm64.exe
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache target dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ccl-release-v2-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/build-release.sh') }}
          restore-keys: |
            ccl-release-v2-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ steps.go.outputs.go-version }}-
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OUTPUT: dist/${{ matrix.asset }}
          # Optional rotation of the built-in public Desktop OAuth client.
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: bash scripts/build-release.sh
      - name: Upload binary
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 3

  release:
    name: Release and publish npm
    if: github.ref_type == 'tag'
    needs: [prepare, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ccl-*
          path: dist
          merge-multiple: true
      - name: Verify asset set and create checksums
        run: |
          for asset in ccl-darwin-amd64 ccl-darwin-arm64 ccl-linux-amd64 ccl-linux-arm64 ccl-win32-x64.exe ccl-win32-arm64.exe; do
            test -s "dist/$asset"
          done
          chmod +x dist/ccl-*
          (cd dist && sha256sum ccl-* > SHA256SUMS)
          ls -lh dist
      - name: Resolve release notes
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            echo "path=docs/releases/$VERSION.md" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            THIRD_PARTY_NOTICES.md
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Prepare npm Assets
        run: |
          cp dist/ccl-* bin/
          chmod +x bin/ccl-* bin/wrapper.js
      - name: Sync Version from Git Tag
        env:
          TAG_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          RAW_VERSION="${TAG_NAME#v}"
          if [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CLEAN_VERSION=$(echo "$RAW_VERSION" | sed -E 's/\.([0-9]+)$/-\1/')
          else
            CLEAN_VERSION="$RAW_VERSION"
          fi
          npm version "$CLEAN_VERSION" --no-git-tag-version
      - name: Check npm Version
        id: npm_version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} already exists; skipping npm publish."
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with Trusted Publishing
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --provenance --access public
