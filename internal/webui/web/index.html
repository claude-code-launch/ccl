<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ccl serve fills this in for --base-path; every relative URL below and every API call resolves against it. -->
    <base href="/" data-ccl-base>
    <title>ccl</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1c1b19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      // Apply the theme before the first paint so a dark page does not flash white.
      (function () {
        var choice = "";
        try { choice = localStorage.getItem("ccl-web-theme") || ""; } catch (e) {}
        var dark = choice ? choice === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CFnNb61p.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C8v5uZFb.css">
